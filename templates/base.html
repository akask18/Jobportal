
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nepal Job Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f5f7fb; color: #172033; }
        .navbar { background: #102a43; }
        .navbar-brand, .nav-link { color: white !important; }
        .hero { background: #e5efff; padding: 55px 20px; }
        .job-card { border: 0; border-radius: 14px; }
        .btn-primary { background: #2457d6; border-color: #2457d6; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            Nepal Job Portal
        </a>
        
<div class="ms-auto d-flex align-items-center gap-3">
    <a class="nav-link" href="{% url 'home' %}">Home</a>
    <a class="nav-link" href="{% url 'job_list' %}">Find Jobs</a>

    {% if user.is_authenticated %}
        <span class="text-white">Hi, {{ user.username }}</span>

        <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </form>
    {% else %}
        <a class="nav-link" href="{% url 'login' %}">Login</a>
        <a class="btn btn-light btn-sm" href="{% url 'register' %}">
            Register
        </a>
    {% endif %}
</div>

    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-secondary py-4 mt-5">
    © 2026 Nepal Job Portal
</footer>
</body>
</html>
